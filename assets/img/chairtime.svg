<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img" aria-label="Chairtime app interface mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1934"/>
      <stop offset="0.55" stop-color="#0D1B3B"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#C0A23C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#C0A23C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294f"/>
      <stop offset="1" stop-color="#101f42"/>
    </linearGradient>
    <style>
      .h { font-family: 'Bricolage Grotesque','Segoe UI',sans-serif; font-weight: 800; }
      .b { font-family: 'Figtree','Segoe UI',sans-serif; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1120" height="700" fill="url(#bg)"/>
  <rect width="1120" height="700" fill="url(#glow)"/>

  <!-- app frame -->
  <g>
    <rect x="90" y="82" width="940" height="536" rx="22" fill="#0b1735" stroke="#26365e" stroke-width="1.5"/>

    <!-- top bar -->
    <g class="h">
      <rect x="90" y="82" width="940" height="70" rx="22" fill="#101f42"/>
      <rect x="90" y="130" width="940" height="22" fill="#101f42"/>
      <rect x="118" y="106" width="26" height="26" rx="8" fill="#0D1B3B"/>
      <text x="131" y="124" text-anchor="middle" font-size="12" fill="#C0A23C" class="h">C</text>
      <text x="160" y="125" font-size="20" fill="#ffffff" class="h" letter-spacing="0.5">Chairtime</text>
      <text x="292" y="124" font-size="12" fill="#E4C577" class="b" letter-spacing="3" opacity="0.85">TODAY · THURSDAY</text>
      <circle cx="985" cy="117" r="16" fill="#16294f" stroke="#2c3d66"/>
      <circle cx="985" cy="112" r="5.5" fill="#C0A23C"/>
      <path d="M976 124a9 9 0 0 1 18 0z" fill="#C0A23C"/>
    </g>

    <!-- left: schedule -->
    <text x="130" y="196" font-size="13" fill="#8b97b6" class="b" letter-spacing="2">SCHEDULE</text>

    <!-- appointment rows -->
    <g>
      <!-- row 1 (active) -->
      <rect x="122" y="212" width="536" height="72" rx="14" fill="url(#card)" stroke="#C0A23C" stroke-width="1.5"/>
      <rect x="122" y="212" width="5" height="72" rx="2.5" fill="#C0A23C"/>
      <text x="150" y="242" font-size="17" fill="#ffffff" class="h">Cut &amp; Color</text>
      <text x="150" y="266" font-size="13" fill="#9fabca" class="b">Maria S. · 9:00 – 10:30 AM</text>
      <rect x="560" y="234" width="76" height="28" rx="14" fill="#C0A23C"/>
      <text x="598" y="253" text-anchor="middle" font-size="12" fill="#0D1B3B" class="h">PAID</text>

      <!-- row 2 -->
      <rect x="122" y="296" width="536" height="72" rx="14" fill="#101f42" stroke="#233256"/>
      <rect x="122" y="296" width="5" height="72" rx="2.5" fill="#4a5a82"/>
      <text x="150" y="326" font-size="17" fill="#e9edf6" class="h">Men's Fade</text>
      <text x="150" y="350" font-size="13" fill="#9fabca" class="b">James T. · 11:00 – 11:45 AM</text>
      <rect x="548" y="318" width="88" height="28" rx="14" fill="#16294f" stroke="#2c3d66"/>
      <text x="592" y="337" text-anchor="middle" font-size="12" fill="#E4C577" class="h">BOOKED</text>

      <!-- row 3 -->
      <rect x="122" y="380" width="536" height="72" rx="14" fill="#101f42" stroke="#233256"/>
      <rect x="122" y="380" width="5" height="72" rx="2.5" fill="#4a5a82"/>
      <text x="150" y="410" font-size="17" fill="#e9edf6" class="h">Balayage</text>
      <text x="150" y="434" font-size="13" fill="#9fabca" class="b">Priya K. · 1:00 – 3:00 PM</text>
      <rect x="548" y="402" width="88" height="28" rx="14" fill="#16294f" stroke="#2c3d66"/>
      <text x="592" y="421" text-anchor="middle" font-size="12" fill="#E4C577" class="h">BOOKED</text>

      <!-- reminder chip -->
      <rect x="122" y="470" width="536" height="44" rx="12" fill="#0f1d3f" stroke="#233256"/>
      <circle cx="146" cy="492" r="7" fill="#C0A23C" opacity="0.25"/>
      <circle cx="146" cy="492" r="3.5" fill="#C0A23C"/>
      <text x="166" y="497" font-size="13" fill="#9fabca" class="b">Reminder texts sent to 3 clients</text>
    </g>

    <!-- right: pay at the chair card -->
    <g>
      <rect x="682" y="212" width="320" height="302" rx="18" fill="url(#card)" stroke="#2c3d66"/>
      <text x="710" y="250" font-size="13" fill="#E4C577" class="b" letter-spacing="2">PAY AT THE CHAIR</text>

      <!-- amount -->
      <text x="710" y="312" font-size="52" fill="#ffffff" class="h">$96</text>
      <text x="710" y="340" font-size="14" fill="#9fabca" class="b">Cut &amp; Color · Maria S.</text>

      <!-- tap reader -->
      <rect x="710" y="360" width="264" height="86" rx="14" fill="#0D1B3B" stroke="#C0A23C" stroke-width="1.5"/>
      <g stroke="#C0A23C" stroke-width="2.4" fill="none" stroke-linecap="round">
        <path d="M742 392a14 14 0 0 1 0 22"/>
        <path d="M752 386a24 24 0 0 1 0 34"/>
        <path d="M762 380a34 34 0 0 1 0 46"/>
      </g>
      <text x="792" y="399" font-size="15" fill="#ffffff" class="h">Tap to pay</text>
      <text x="792" y="420" font-size="12.5" fill="#9fabca" class="b">Card reader ready</text>

      <!-- confirm button -->
      <rect x="710" y="462" width="264" height="34" rx="17" fill="#C0A23C"/>
      <text x="842" y="484" text-anchor="middle" font-size="14" fill="#0D1B3B" class="h">Charge $96</text>
    </g>
  </g>
</svg>
